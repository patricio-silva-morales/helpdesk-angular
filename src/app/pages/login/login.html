<!-- MODIFICADO: reemplaza el selector de perfiles por credenciales. -->
<section class="acceso" aria-labelledby="titulo-acceso">
  <h1 id="titulo-acceso">Acceso al Help Desk</h1>

  <form #formulario="ngForm" (ngSubmit)="entrar()">
    <label for="username">Usuario</label>
    <input
      id="username"
      name="username"
      autocomplete="username"
      [(ngModel)]="username"
      required
    />

    <label for="password">Contraseña</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      [(ngModel)]="password"
      required
    />

    @if (mensajeError()) {
      <p class="error" role="alert">{{ mensajeError() }}</p>
    }

    <button
      type="submit"
      [disabled]="formulario.invalid || enviando()"
    >
      {{ enviando() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>
</section>
